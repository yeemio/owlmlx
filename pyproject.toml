[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owlmlx"
version = "0.2.0"
description = "Self-owned MLX runtime for Apple Silicon"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
runtime = [
    "mlx>=0.22.0",
    "mlx-lm>=0.22.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["owlmlx"]

[tool.owlmlx]
release_channel = "engineering"
consumer_readiness_gate = "owlcoda_npm_local_model_learning_loop"

[tool.pytest.ini_options]
testpaths = ["tests"]
