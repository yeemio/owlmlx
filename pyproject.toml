[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owlmlx"
version = "0.2.0"
description = "Self-owned MLX runtime for Apple Silicon"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
runtime = [
    "mlx>=0.22.0",
    "mlx-lm>=0.22.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
dev = [
    "pytest>=8.0",
]
deepseek-experimental = [
    "mlx-lm @ git+https://github.com/Blaizzy/mlx-lm@5c10538136b9038b9626c134612b08afc18d697a",
]
# Grammar-constrained structured-output decoding (F-4.2). Experimental-only:
# xgrammar pulls torch transitively (~84MB), so this is never part of the
# default or `runtime` install. The child runner builds the grammar matcher
# from a serializable spec (see owlmlx/runtime/mlx_lm_runner.py
# _build_grammar_logits_processor). xgrammar is pinned because the
# structural-tag construction used for the thinking_tag family relies on a
# form that is marked deprecated upstream (see
# docs/architect/design/F-4-2-grammar-constrained-baseline-spec.md §4.1).
grammar-experimental = [
    "xgrammar==0.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["owlmlx"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.owlmlx]
release_channel = "engineering"
consumer_readiness_gate = "owlcoda_npm_local_model_learning_loop"

[tool.pytest.ini_options]
testpaths = ["tests"]
